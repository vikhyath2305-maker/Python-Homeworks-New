<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favorite Recipe Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fbc531, #e84118);
      font-family: Arial, sans-serif;
    }
    .recipe-card {
      border: 3px solid #8c7ae6;
      padding: 20px;
      text-align: center;
      background-color: #f5f6fa;
      border-radius: 12px;
      max-width: 280px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    header h1 {
      color: #9c88ff;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    header h2 {
      color: #4cd137;
      font-size: 1.3rem;
      margin-top: 0;
    }
    p {
      color: #2f3640;
      font-size: 0.9rem;
    }
    .recipe-card img {
      width: 100%;
      height: auto;
      border: 2px solid #00a8ff;
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <main>
    <section class="recipe-card">
      <header>
        <h1>Recipe Highlight</h1>
        <h2>Fettuccine Alfredo</h2>
        <p>Rich and creamy garlic parmesan sauce tossed over tender fettuccine pasta.</p>
      </header>
      <img src="https://th.bing.com/th/id/OIP.96TKjFZ5MnmsxybnrpSQ5QHaJQ?w=208&h=260&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Fettuccine Alfredo">
    </section>
  </main>

</body>
</html>
